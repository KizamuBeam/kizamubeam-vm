# Builds KizamuBeam Virtual Machine for macOS, Windows and Linux and attaches the installers
# to its release. Tags may be v0.5.0 or vm-v0.5.0; the version must match src-tauri/tauri.conf.json.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag eines veröffentlichten Releases der Virtual Machine, z. B. v0.5.0 oder vm-v0.5.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

concurrency:
  group: vm-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Tag passt zur Version
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$TAG" != "v$v" ] && [ "$TAG" != "vm-v$v" ]; then
            echo "::error::Tag $TAG passt nicht zur Version $v in src-tauri/tauri.conf.json (erwartet v$v oder vm-v$v)."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Tests der Steuerung
        run: cargo test -p kizamubeam-vm-core
        working-directory: src-tauri/core

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Linux-Abhängigkeiten
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS: sign ad hoc without an Apple certificate (as for KizamuBeam)
          APPLE_SIGNING_IDENTITY: '-'
        with:
          projectPath: .
          tauriScript: npx tauri
          tagName: ${{ env.TAG }}
          releaseName: KizamuBeam Virtual Machine ${{ env.TAG }}
          releaseBody: 'Virtuelle Lasermaschine (GRBL/FluidNC/Ruida) zum Testen ohne Hardware. Installer für macOS, Windows und Linux stehen unten unter „Assets“.'
          releaseDraft: false
          prerelease: ${{ github.event.release.prerelease || false }}
          args: ${{ matrix.args }}
